[project]
name = "simple-golf-simulator"
version = "1.0"
description = "A physics-based golf swing and ball trajectory simulator with a Tkinter GUI"
readme = "README.md"
license = "ISC"
authors = [{ name = "Cheng-Chin Chiang" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:FigureCanvasAgg is non-interactive:UserWarning"]

[tool.ruff]
extend-exclude = ["docs"]

[tool.ruff.lint]
# Correctness checks only (the classic ruff defaults); the code keeps its own layout conventions.
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"] # physics symbols such as I (moment of inertia) are intentional
