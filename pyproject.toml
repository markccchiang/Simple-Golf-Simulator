[project]
name = "simple-golf-simulator"
version = "1.0"
description = "A physics-based golf swing and ball trajectory simulator with a Tkinter GUI"
readme = "README.md"
license = "ISC"
authors = [{ name = "Cheng-Chin Chiang" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore:FigureCanvasAgg is non-interactive:UserWarning"]
